# =============================================
# Configuração do Nginx
# =============================================
# O Nginx é um servidor web ultra-rápido. Aqui ele serve os
# arquivos estáticos (HTML/CSS/JS) e faz proxy das chamadas /api
# para o container do backend Java.

server {
    listen 80;
    server_name localhost;

    # Serve os arquivos estáticos do frontend
    root /usr/share/nginx/html;
    index index.html;

    # Rota principal: serve o index.html para qualquer path
    location / {
        try_files $uri $uri/ /index.html;
    }

    # PROXY REVERSO: /api/* vai para o container "backend" na porta 8080
    # "backend" é o nome do serviço definido no docker-compose.yml
    # O Docker resolve esse nome automaticamente pela rede interna
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
