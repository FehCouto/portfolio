# =============================================
# Configuração do Nginx (template com variável de ambiente)
# =============================================
# ${BACKEND_URL} é substituído automaticamente pelo Nginx na inicialização.
# - Localmente (Docker Compose): BACKEND_URL=http://backend:8080
# - No Railway:                  BACKEND_URL=http://portfolio-backend.railway.internal:8080

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy reverso para a API Java.
    # A URL do backend vem da variável de ambiente ${BACKEND_URL}.
    location /api/ {
        proxy_pass ${BACKEND_URL};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
